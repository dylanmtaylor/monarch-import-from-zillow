[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monarch-import-from-zillow"
version = "0.1.0"
description = "Generate continuous daily real estate balance history from Zillow for import into Monarch Money."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Dylan M. Taylor", email = "dylan@dylanmtaylor.com" }
]
keywords = [
    "monarch",
    "monarch-money",
    "zillow",
    "zestimate",
    "real-estate",
    "asset",
    "balance-history",
    "finance",
    "net-worth",
    "csv",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
zillow-to-monarch = "zillow_to_monarch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zillow_to_monarch*"]
